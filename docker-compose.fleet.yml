# Phase 5.10 — multi-gateway fleet.
#
# One control plane, two physically separate enforcement gateways, one Hermes
# agent behind each. The point of this file is to make central policy rollout
# observable: a rule created once against the control plane reaches gateway-a
# and gateway-b only via their versioned policy-snapshot fetch, so both start
# auto-approving without either container being restarted.
#
# Network topology (see also 5.10.2):
#
#   control-net   postgres + control-plane + both gateways
#   gateway-a-net gateway-a <-> hermes-a          (internal, no egress)
#   gateway-b-net gateway-b <-> hermes-b          (internal, no egress)
#   egress        gateways only
#
# Each Hermes container sits alone with its own gateway on an internal network,
# so it can reach neither the internet, nor Postgres, nor the other tenant's
# agent. That preserves the bypass-prevention story from Phase 4 rather than
# putting both agents on one broad egress-enabled network.
#
# Gateways still hold a Postgres connection: policy *decisions* come from the
# snapshot, but egress-request rows, approve-once grants, standing denies, and
# audit writes remain central state. §5.8.6 permits this ("gateway -> may still
# read Postgres") and calls for removing it gradually.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes_policy
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - control-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_policy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  control-plane:
    build:
      context: .
      dockerfile: services/policy-gateway/Dockerfile
    environment:
      CLEARANCE_MODE: control
      POSTGRES_DSN: postgres://hermes:hermes@postgres:5432/hermes_policy?sslmode=disable
      GATEWAY_LISTEN_ADDR: :8080
      GATEWAY_PROXY_ENABLED: "false"
      GATEWAY_ORG_ID: "11111111-1111-1111-1111-111111111010"
      GATEWAY_USER_ID: "11111111-1111-1111-1111-111111111001"
      GATEWAY_AGENT_ID: "11111111-1111-1111-1111-111111111020"
      GATEWAY_ADMIN_ID: "11111111-1111-1111-1111-111111111002"
      GATEWAY_ADMIN_TOKEN: "dev-local-admin-token"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway-a: &gateway
    build:
      context: .
      dockerfile: services/policy-gateway/Dockerfile
    environment: &gateway-env
      CLEARANCE_MODE: gateway
      POSTGRES_DSN: postgres://hermes:hermes@postgres:5432/hermes_policy?sslmode=disable
      GATEWAY_PROXY_LISTEN_ADDR: :8081
      GATEWAY_PROXY_ENABLED: "true"
      CLEARANCE_CONTROL_URL: http://control-plane:8080
      # Short intervals keep the demo observable end to end; production would
      # use the 5s/15m defaults from Phase 5.9.
      CLEARANCE_POLICY_REFRESH_INTERVAL: 3s
      CLEARANCE_POLICY_MAX_STALE: 2m
      CLEARANCE_HEARTBEAT_INTERVAL: 5s
      CLEARANCE_AGENT_IDENTITY_CACHE_TTL: 3s
      GATEWAY_AGENT_AUTH_MODE: token
      GATEWAY_ORG_ID: "11111111-1111-1111-1111-111111111010"
      GATEWAY_USER_ID: "11111111-1111-1111-1111-111111111001"
      GATEWAY_AGENT_ID: "11111111-1111-1111-1111-111111111020"
      GATEWAY_ADMIN_ID: "11111111-1111-1111-1111-111111111002"
      # Injected by scripts/smoke-phase510-fleet.sh after registration.
      CLEARANCE_GATEWAY_TOKEN: ${GATEWAY_A_TOKEN:-}
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - control-net
      - gateway-a-net
      - egress

  gateway-b:
    <<: *gateway
    environment:
      <<: *gateway-env
      CLEARANCE_GATEWAY_TOKEN: ${GATEWAY_B_TOKEN:-}
    networks:
      - control-net
      - gateway-b-net
      - egress

  hermes-a: &hermes
    build:
      context: ./services/hermes
      args:
        HERMES_AGENT_REF: ${HERMES_AGENT_REF:-v2026.8.18}
        HERMES_AGENT_SHA: ${HERMES_AGENT_SHA:-e624e9fde561e1add9388384012b295fde669ade}
    environment: &hermes-env
      GATEWAY_HEALTH_URL: http://gateway-a:8081/health
      HTTP_PROXY: http://gateway-a:8081
      HTTPS_PROXY: http://gateway-a:8081
      NO_PROXY: localhost,127.0.0.1,gateway-a
      HERMES_HOME: /data/hermes-home
      HERMES_WORKDIR: /tmp/hermes-workspace
      HERMES_TOOLSETS: terminal,web
      TERMINAL_ENV: local
    depends_on:
      - gateway-a
    networks:
      - gateway-a-net
    volumes:
      - ./workspace:/work:ro
      - fleet_hermes_a_data:/data

  hermes-b:
    <<: *hermes
    environment:
      <<: *hermes-env
      GATEWAY_HEALTH_URL: http://gateway-b:8081/health
      HTTP_PROXY: http://gateway-b:8081
      HTTPS_PROXY: http://gateway-b:8081
      NO_PROXY: localhost,127.0.0.1,gateway-b
    depends_on:
      - gateway-b
    networks:
      - gateway-b-net
    volumes:
      - ./workspace:/work:ro
      - fleet_hermes_b_data:/data

networks:
  control-net:
    internal: true
  gateway-a-net:
    internal: true
  gateway-b-net:
    internal: true
  egress:
    driver: bridge

volumes:
  fleet_postgres_data:
  fleet_hermes_a_data:
  fleet_hermes_b_data:
